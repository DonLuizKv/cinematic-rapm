services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mosquitto-broker
    ports:
      - "1883:1883"     # Puerto MQTT
      - "9001:9001"     # Puerto para WebSockets (si lo necesitas)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: ramp-back
    ports:
      - "3000:3000" 
    depends_on:
      - mqtt-broker
    environment:
      - MQTT_HOST=mqtt-broker
    restart: always

